name: DCO

# Requires a Signed-off-by trailer on every commit in the pull request, via the
# repository-local reusable. Keep its policy aligned with the sibling channels.

# Pull request only. It reads the commits between a pull request's base
# and head and checks each carries a sign-off, so a push to `main` is not
# a range it can walk. The question is NOT settled by a push: a human can
# commit straight to `main` here, which is why dco-on-main.yml exists and
# why four such commits are already on this branch.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    uses: ./.github/workflows/reusable-dco.yml
