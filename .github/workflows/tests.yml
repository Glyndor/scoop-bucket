name: Tests

# The shell lint, this repository's own suite, and the two checks that read the
# generated tree: that PRODUCTS and bucket/ still agree, and that every
# manifest is valid JSON with the fields Scoop needs.
#
# Split out of the former ci.yml, which carried the suite, pull request hygiene
# and two freshness watchers in one file. They fail for different reasons and
# are read by different people.
#
# Job ids are unchanged. A required status check is named
# `<caller job id> / <inner job name>` and the FILE is not part of that name, so
# moving a job to another workflow leaves its check name alone. Renaming one is
# a ruleset change, not tidying.
#
# The suite is listed one per line. As a single line it outgrew any terminal,
# which is how a suite went missing from apt's without anyone noticing.

on:
  pull_request:
  # No `push` to main: what lands there came through a pull request that this workflow
  # judged, on the tree that lands, because the ruleset requires the branch up to date and
  # the checks that judge the pull request. One actor bypasses it, the app that regenerates
  # the manifests and pushes them with no pull request; that path is judged by update.yml
  # before it pushes and by generated-on-main.yml and published-bytes.yml after. freshness.yml
  # reads the ruleset and compares it with the copy in the repository.
  # tests/ci/policy/workflows/push-runs-only-what-main-owns.test.sh holds the list of the
  # workflows that do run on a push, with the reason of each.

permissions:
  contents: read

# The first item is the runner and the rest are its arguments. A `&&` chain
# cannot tell a suite that ran every assertion from one that exited early
# having run three: both leave a zero status and the chain moves on. Every
# test file now ends by printing a sentinel after its last assertion, and
# tests/ci/suites/check-suite-completeness.test.sh requires one from every file it was
# given, naming the file that did not produce one.
#

jobs:
  shell:
    uses: ./.github/workflows/reusable-shell-ci.yml
    with:
      # No path is listed, so nothing is ever skipped. The suite reads every
      # document under docs/ through scripts/quality/hygiene/check-doc-anchors.sh, so a
      # pull request that touches nothing but prose is exactly the one that can
      # break a reference; README.md is read by check-issue-templates for
      # the same reason. tests/ci/suites/shell-ci-scope.test.sh fails if this
      # list grows to a file the suite reads.
      #
      # Every check under scripts/quality/ runs from here, through its own test
      # in the same folder of tests/. A gate nobody watches fail is a gate
      # nobody trusts, so each one plants the violation it refuses instead of
      # only declaring it: check-action-pins.sh refuses a `uses:` that names a
      # tag or a branch instead of a commit SHA, and its test refuses one on
      # purpose.
      test-command: >-
        ./tests/ci/suites/check-suite-completeness.test.sh
        ./tests/ci/suites/check-suite-completeness-verdict.test.sh
        ./tests/ci/suites/step-script.test.sh
        ./tests/release/render-manifests.test.sh
        ./tests/release/render-manifests/render-manifests-attestation.test.sh
        ./tests/release/render-manifests/render-manifests-sums-selection.test.sh
        ./tests/release/render-manifests/render-manifests-hash-of.test.sh
        ./tests/release/render-manifests/render-manifests-verify-published.test.sh
        ./tests/release/render-manifests/render-manifests-inputs.test.sh
        ./tests/release/render-manifests/render-manifests-transfer-limits.test.sh
        ./tests/release/render-manifests/render-manifests-products.test.sh
        ./tests/release/render-manifests/render-manifests-guards.test.sh
        ./tests/release/products.test.sh
        ./tests/release/render-manifests/render-manifests-symlink.test.sh
        ./tests/release/release-signature.test.sh
        ./tests/publication/update/update-workflow.test.sh
        ./tests/publication/update/update-key-isolation.test.sh
        ./tests/publication/update/update-digest-handoff.test.sh
        ./tests/publication/update/update-mldsa-venv.test.sh
        ./tests/artifacts/check-products-consistent.test.sh
        ./tests/artifacts/check-manifests.test.sh
        ./tests/artifacts/check-manifests/check-manifests-identity.test.sh
        ./tests/artifacts/check-manifests/check-manifests-binding.test.sh
        ./tests/artifacts/check-manifests/check-manifests-duplicate-keys.test.sh
        ./tests/artifacts/check-manifests/check-manifests-nonregular.test.sh
        ./tests/artifacts/manifest-digests.test.sh
        ./tests/artifacts/check-version-monotonic.test.sh
        ./tests/ci/policy/rules/locale-pinned.test.sh
        ./tests/ci/policy/workflows/workflow-publish-triggers.test.sh
        ./tests/quality/coverage/check-test-coverage.test.sh
        ./tests/quality/hygiene/check-doc-anchors.test.sh
        ./tests/quality/lint/check-action-pins.test.sh
        ./tests/governance/check-dco-on-main.test.sh
        ./tests/governance/check-issue-templates.test.sh
        ./tests/monitoring/check-main-ruleset.test.sh
        ./tests/ci/policy/workflows/push-runs-only-what-main-owns.test.sh
        ./tests/ci/policy/workflows/recent-pushes-are-judged.test.sh
        ./tests/ci/policy/workflows/main-judges-from-the-commit-it-had.test.sh
        ./tests/ci/policy/workflows/push-guard-trusts-the-commit-it-had.test.sh
        ./tests/monitoring/check-schedule-history-ready.test.sh
        ./tests/ci/policy/workflows/published-bytes-ready-step.test.sh
        ./tests/ci/docs/documented-test-command.test.sh
        ./tests/ci/docs/documented-claims.test.sh
        ./tests/ci/suites/ci-runs-every-test.test.sh
        ./tests/quality/coverage/check-suites-wired.test.sh
        ./tests/quality/lint/lint-workflow-shell.test.sh
        ./tests/ci/reusable/reusable-line-limit.test.sh
        ./tests/ci/reusable/reusable-shell-ci.test.sh
        ./tests/ci/suites/shell-ci-scope.test.sh
        ./tests/quality/scope/ci-job-scope.test.sh
        ./tests/quality/scope/ci-job-scope-suites.test.sh
        ./tests/quality/scope/suite-scope-map.test.sh
        ./tests/quality/scope/ci-job-scope-suite-needed.test.sh
        ./tests/quality/scope/ci-job-scope-packages.test.sh
        ./tests/monitoring/check-push-to-main.test.sh
        ./tests/monitoring/report-failure.test.sh
        ./tests/ci/suites/mldsa-job-scope.test.sh
        ./tests/ci/suites/lint-job-scope.test.sh
        ./tests/ci/policy/rules/cancel-policy.test.sh
        ./tests/ci/reusable/reusable-empty-diff.test.sh
        ./tests/ci/reusable/reusable-dco.test.sh
        ./tests/quality/hygiene/check-editorconfig.test.sh
        ./tests/monitoring/check-reusable-drift.test.sh
        ./tests/monitoring/check-channel-drift.test.sh
        ./tests/ci/policy/rules/drift-watchers-transfer-cap.test.sh
        ./tests/ci/policy/workflows/workflow-shape.test.sh
        ./tests/ci/policy/workflows/persist-credentials.test.sh
        ./tests/ci/policy/workflows/skip-only-on-an-explicit-false.test.sh
        ./tests/ci/policy/workflows/required-checks-are-emitted.test.sh
        ./tests/ci/policy/workflows/pull-request-runs-are-superseded.test.sh
        ./tests/ci/policy/workflows/freshness-pr-scope.test.sh
        ./tests/ci/policy/workflows/install-covers-the-bucket.test.sh
        ./tests/monitoring/previous-manifest.test.sh
        ./tests/monitoring/install-from-the-bucket.test.sh
        ./tests/ci/policy/workflows/mutation-sweep-is-split-and-bounded.test.sh
        ./tests/ci/policy/workflows/scheduled-workflows-are-watched.test.sh
        ./tests/ci/policy/workflows/workflows-parse-strictly.test.sh
        ./tests/ci/policy/workflows/runners-are-named.test.sh
        ./tests/ci/policy/workflows/required-check-names-are-unique.test.sh
        ./tests/ci/policy/workflows/freshness-poll-concurrency.test.sh
        ./tests/ci/policy/workflows/dependabot-groups.test.sh
        ./tests/ci/policy/workflows/workflows-run-their-scripts.test.sh
        ./tests/ci/policy/workflows/published-bytes-order.test.sh
        ./tests/monitoring/check-render-drift.test.sh
        ./tests/monitoring/check-published-manifests.test.sh
        ./tests/monitoring/published-url-rules-agree.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-drift.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-missing.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-network.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-digest-case.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-version.test.sh
        ./tests/ci/reusable/reusable-dependabot-freshness.test.sh
        ./tests/ci/reusable/reusable-schedule-freshness.test.sh
        ./tests/ci/reusable/reusable-schedule-freshness/reusable-schedule-freshness-grace.test.sh
        ./tests/ci/reusable/reusable-workflow-lint.test.sh
        ./tests/monitoring/check-tool-versions.test.sh
        ./tests/quality/lint/check-test-job-not-switchable.test.sh
        ./tests/quality/lint/check-test-job-not-switchable-inputs.test.sh
        ./tests/quality/lint/check-test-job-not-switchable-jobs.test.sh
        ./tests/quality/lint/check-test-job-not-switchable-steps.test.sh
        ./tests/quality/lint/check-test-job-not-switchable-pins.test.sh
        ./tests/quality/lint/check-test-job-not-switchable-forms.test.sh
        ./tests/quality/lint/check-test-job-not-switchable-context.test.sh
        ./tests/quality/lint/check-test-job-not-switchable-checkout.test.sh
        ./tests/quality/lint/check-tooling-isolation.test.sh
        ./tests/ci/policy/rules/jobs-are-bounded.test.sh
        ./tests/ci/policy/rules/network-calls-are-bounded.test.sh
        ./tests/ci/policy/rules/workflow-network-calls-are-bounded.test.sh
        ./tests/mutation/run-mutations.test.sh
        ./tests/mutation/catalog-reaches-every-script.test.sh
      # shellcheck: tests/quality/lint/lint-workflow-shell.test.sh plants a violation and
      # requires the linter to report it, so it needs the linter. The reusable
      # installs the release the shellcheck job pins, never the distribution's,
      # so the suite asks the linter the gate uses. On a pull request only the
      # packages of the suites it selects are installed, as
      # scripts/quality/scope/suite-dependencies.txt lists them.
      # python3-yaml: the two workflow-lint scripts import it, and their suites,
      # tests/quality/lint/check-test-job-not-switchable.test.sh and
      # tests/quality/lint/check-tooling-isolation.test.sh, run them exactly as the
      # workflow-lint job does.
      apt-packages: shellcheck python3-yaml

  # The ML-DSA-65 half of the release signature check, verified for real. It
  # needs cryptography 50.0.2 or later and the runner's python3-cryptography has
  # no ML-DSA, so this suite cannot run in the shell job: the wheel is installed
  # into a virtual environment from scripts/release/render-requirements.txt,
  # pinned by hash and binary only, and that environment comes first on PATH for
  # the suite and for the renderer it runs. Without the wheel the suite fails
  # and says what is missing; it never skips.
  #
  # A job of its own rather than a second package list in the reusable: the
  # reusable installs from the distribution, and this is the one suite that
  # needs a library the distribution does not carry. It holds no secret.
  #
  # What it costs and when it runs. Measured 10 seconds locally for the venv,
  # the three wheels and the suite; on a runner the wheels come from PyPI, so
  # the network is most of it. It runs on a pull request and on a push to main,
  # and on each only when something that can change its verdict changed: the
  # verifier and what it sources, the requirements file with its hashes, the
  # suites and fixtures of ML-DSA, this workflow and the decision itself, all
  # named in scripts/quality/scope/suite-scope.txt. Any other event runs it,
  # and so does any doubt.
  #
  # It is not a required check yet: adding it to the ruleset is the owner's
  # decision, and nothing waits on it today. It is built so that it can be one
  # the day it is added. A job skipped as a job reports success, which would
  # read "did not apply" as "passed", so it is never skipped: no `paths:` on the
  # workflow, no `if:` or `needs:` on the job. It always starts, decides in its
  # first step and reports under its own name, and only the wheel install and
  # the suite are conditional. Its own `concurrency` lets a newer push supersede
  # the run on a pull request and never cancels a run on main.
  mldsa:
    name: ML-DSA-65 verifier
    concurrency:
      group: mldsa-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # ubuntu-latest resolved to ubuntu-26.04 in apt's publish runs on
    # 2026-11-20. The image is named because this job's verdict depends on the
    # tools it ships, so a new image arrives as a commit and not overnight.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    # Measured 10 seconds locally for the venv, the three wheels and the suite.
    # Ten minutes is far above that and far below the six-hour default a hang
    # would otherwise cost.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # The resolver is read from the commit the change is measured against, so
      # a change cannot narrow its own scope: the base of a pull request, the
      # commit a push replaced. A base that does not carry it, one that cannot
      # be read, an answer that is not true or false and any failure run the
      # suite. A decision that skips is written to the step summary, so a run
      # that was skipped by decision reads differently from one that ran.
      - name: Decide whether the ML-DSA-65 suite has anything to look at
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          SUITE: tests/release/release-signature/release-signature-mldsa.test.sh
        run: |
          set -euo pipefail
          needed=true
          base=""
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          elif [ "$EVENT" = push ] && [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            base="$BEFORE_SHA"
          fi
          script="$(mktemp "$RUNNER_TEMP/mldsa-scope.XXXXXX")" || script=""
          trap '[ -z "$script" ] || rm -f "$script"' EXIT
          if [ -n "$base" ] && [ -n "$script" ] \
            && git show "$base:scripts/quality/scope/ci-job-scope.sh" > "$script" 2>/dev/null; then
            if decision="$(bash "$script" suite-needed "$SUITE")" \
              && [[ "$decision" == true || "$decision" == false ]]; then
              needed="$decision"
            fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [ "$needed" = false ]; then
            echo "No input of the ML-DSA-65 verifier changed; the wheel install and the suite are skipped by decision." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Running the ML-DSA-65 verifier suite (changed inputs, or the scope was not established)."
          fi

      - name: Install the pinned cryptography wheel
        if: steps.scope.outputs.needed != 'false'
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mldsa-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/release/render-requirements.txt
          echo "$venv/bin" >> "$GITHUB_PATH"

      # The decision is read inside the script and not in an `if:` on the step:
      # scripts/quality/coverage/check-suites-wired.sh counts a suite as wired
      # only when it is named in a step with no condition, which is what stops
      # a pull request from switching a suite off by adding one. Anything but
      # "false" runs the suite.
      - name: Run the ML-DSA-65 verifier suite
        env:
          NEEDED: ${{ steps.scope.outputs.needed }}
        run: |
          set -euo pipefail
          if [ "$NEEDED" = false ]; then
            echo "ML-DSA-65 verifier: skipped by decision, nothing the suite reads changed."
            exit 0
          fi
          ./tests/ci/suites/check-suite-completeness.test.sh ./tests/release/release-signature/release-signature-mldsa.test.sh

  products:
    concurrency:
      group: products-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: products match the generator
    # ubuntu-latest resolved to ubuntu-26.04 in apt's publish runs on
    # 2026-11-20. The image is named because this job's verdict depends on the
    # tools it ships, so a new image arrives as a commit and not overnight.
    runs-on: ubuntu-26.04
    # Measured at 5 seconds.
    # It decides nothing about its scope on purpose: reading what changed costs
    # a checkout and a script, which is what running the job costs, so a
    # decision would spend as much as the answer it saves.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: bucket/ must match PRODUCTS
        run: |
          set -euo pipefail
          # The check lives in scripts/ so it can be tested. Inline here it was
          # reachable only by a real CI run, which is why it had never been
          # watched fail. tests/artifacts/check-products-consistent.test.sh covers it.
          ./scripts/artifacts/check-products-consistent.sh

  manifests:
    concurrency:
      group: manifests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: validate manifests
    # ubuntu-latest resolved to ubuntu-26.04 in apt's publish runs on
    # 2026-11-20. The image is named because this job's verdict depends on the
    # tools it ships, so a new image arrives as a commit and not overnight.
    runs-on: ubuntu-26.04
    # Measured at 4 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check each manifest is valid JSON with the required fields
        run: |
          set -euo pipefail
          # One copy, called from here and from update.yml. It used to be
          # duplicated in both with a comment on each asking whoever edited one
          # to keep the other in step.
          ./scripts/artifacts/check-manifests.sh

      - name: A manifest never goes back to an older release
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The renderer refuses a rollback, a hand edit does not. The base is
          # fetched on its own: the checkout is shallow and has no history.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          ./scripts/artifacts/check-version-monotonic.sh "$BASE_SHA"
