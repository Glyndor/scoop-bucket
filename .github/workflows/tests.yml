name: Tests

# The shell lint, this repository's own suite, and the two checks that read the
# generated tree: that PRODUCTS and bucket/ still agree, and that every
# manifest is valid JSON with the fields Scoop needs.
#
# Split out of the former ci.yml, which carried the suite, pull request hygiene
# and two freshness watchers in one file. They fail for different reasons and
# are read by different people.
#
# Job ids are unchanged. A required status check is named
# `<caller job id> / <inner job name>` and the FILE is not part of that name, so
# moving a job to another workflow leaves its check name alone. Renaming one is
# a ruleset change, not tidying.
#
# The suite is listed one per line. As a single line it outgrew any terminal,
# which is how a suite went missing from apt's without anyone noticing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The first item is the runner and the rest are its arguments. A `&&` chain
# cannot tell a suite that ran every assertion from one that exited early
# having run three: both leave a zero status and the chain moves on. Every
# test file now ends by printing a sentinel after its last assertion, and
# tests/ci/suites/check-suite-completeness.test.sh requires one from every file it was
# given, naming the file that did not produce one.
#

jobs:
  shell:
    uses: ./.github/workflows/reusable-shell-ci.yml
    with:
      # No path is listed, so nothing is ever skipped. The suite reads every
      # document under docs/ through scripts/quality/check-doc-anchors.sh, so a
      # pull request that touches nothing but prose is exactly the one that can
      # break a reference; README.md is read by check-issue-templates for
      # the same reason. tests/ci/suites/shell-ci-scope.test.sh fails if this
      # list grows to a file the suite reads.
      #
      # Every check under scripts/quality/ runs from here, through its own test
      # in the same folder of tests/. A gate nobody watches fail is a gate
      # nobody trusts, so each one plants the violation it refuses instead of
      # only declaring it: check-action-pins.sh refuses a `uses:` that names a
      # tag or a branch instead of a commit SHA, and its test refuses one on
      # purpose.
      test-command: >-
        ./tests/ci/suites/check-suite-completeness.test.sh
        ./tests/release/render-manifests.test.sh
        ./tests/release/render-manifests/render-manifests-attestation.test.sh
        ./tests/release/render-manifests/render-manifests-sums-selection.test.sh
        ./tests/release/render-manifests/render-manifests-inputs.test.sh
        ./tests/release/render-manifests/render-manifests-transfer-limits.test.sh
        ./tests/release/render-manifests/render-manifests-products.test.sh
        ./tests/release/render-manifests/render-manifests-guards.test.sh
        ./tests/release/products.test.sh
        ./tests/release/render-manifests/render-manifests-symlink.test.sh
        ./tests/release/release-signature.test.sh
        ./tests/publication/update/update-workflow.test.sh
        ./tests/publication/update/update-key-isolation.test.sh
        ./tests/publication/update/update-digest-handoff.test.sh
        ./tests/publication/update/update-mldsa-venv.test.sh
        ./tests/artifacts/check-products-consistent.test.sh
        ./tests/artifacts/check-manifests.test.sh
        ./tests/artifacts/check-manifests/check-manifests-identity.test.sh
        ./tests/artifacts/check-manifests/check-manifests-binding.test.sh
        ./tests/artifacts/check-manifests/check-manifests-duplicate-keys.test.sh
        ./tests/artifacts/check-manifests/check-manifests-nonregular.test.sh
        ./tests/artifacts/manifest-digests.test.sh
        ./tests/artifacts/check-version-monotonic.test.sh
        ./tests/ci/policy/rules/locale-pinned.test.sh
        ./tests/ci/policy/workflows/workflow-publish-triggers.test.sh
        ./tests/quality/check-test-coverage.test.sh
        ./tests/quality/check-doc-anchors.test.sh
        ./tests/quality/check-action-pins.test.sh
        ./tests/governance/check-dco-on-main.test.sh
        ./tests/governance/check-issue-templates.test.sh
        ./tests/monitoring/check-suite-on-main.test.sh
        ./tests/monitoring/check-schedule-history-ready.test.sh
        ./tests/monitoring/check-suite-on-main/check-suite-on-main-push.test.sh
        ./tests/monitoring/check-suite-on-main/check-suite-on-main-retry.test.sh
        ./tests/monitoring/check-suite-on-main/check-suite-on-main-order.test.sh
        ./tests/ci/docs/documented-test-command.test.sh
        ./tests/ci/suites/ci-runs-every-test.test.sh
        ./tests/quality/check-suites-wired.test.sh
        ./tests/quality/lint-workflow-shell.test.sh
        ./tests/ci/reusable/reusable-line-limit.test.sh
        ./tests/ci/reusable/reusable-shell-ci.test.sh
        ./tests/ci/suites/shell-ci-scope.test.sh
        ./tests/quality/ci-job-scope.test.sh
        ./tests/quality/ci-job-scope-suites.test.sh
        ./tests/ci/suites/lint-job-scope.test.sh
        ./tests/ci/policy/rules/cancel-policy.test.sh
        ./tests/ci/reusable/reusable-empty-diff.test.sh
        ./tests/ci/reusable/reusable-dco.test.sh
        ./tests/quality/check-editorconfig.test.sh
        ./tests/monitoring/check-reusable-drift.test.sh
        ./tests/monitoring/check-channel-drift.test.sh
        ./tests/ci/policy/rules/drift-watchers-transfer-cap.test.sh
        ./tests/ci/policy/workflows/workflow-shape.test.sh
        ./tests/ci/policy/workflows/freshness-pr-scope.test.sh
        ./tests/ci/policy/workflows/freshness-poll-concurrency.test.sh
        ./tests/ci/policy/workflows/dependabot-groups.test.sh
        ./tests/ci/policy/workflows/workflows-run-their-scripts.test.sh
        ./tests/ci/policy/workflows/published-bytes-order.test.sh
        ./tests/monitoring/check-render-drift.test.sh
        ./tests/monitoring/check-published-manifests.test.sh
        ./tests/monitoring/published-url-rules-agree.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-drift.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-missing.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-network.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-digest-case.test.sh
        ./tests/monitoring/check-render-drift/check-render-drift-version.test.sh
        ./tests/ci/reusable/reusable-dependabot-freshness.test.sh
        ./tests/ci/reusable/reusable-schedule-freshness.test.sh
        ./tests/ci/reusable/reusable-workflow-lint.test.sh
        ./tests/monitoring/check-tool-versions.test.sh
        ./tests/quality/check-test-job-not-switchable.test.sh
        ./tests/quality/check-tooling-isolation.test.sh
        ./tests/ci/policy/rules/jobs-are-bounded.test.sh
        ./tests/ci/policy/rules/network-calls-are-bounded.test.sh
        ./tests/mutation/run-mutations.test.sh
        ./tests/mutation/catalog-reaches-every-script.test.sh
      # shellcheck: tests/quality/lint-workflow-shell.test.sh plants a violation and
      # requires the linter to report it, so it needs the linter. The gate
      # itself runs in the shellcheck job against the pinned binary; this one
      # asserts behaviour, which does not turn on the exact version.
      # python3-yaml: the two workflow-lint scripts import it, and their suites,
      # tests/quality/check-test-job-not-switchable.test.sh and
      # tests/quality/check-tooling-isolation.test.sh, run them exactly as the
      # workflow-lint job does.
      apt-packages: shellcheck python3-yaml

  # The ML-DSA-65 half of the release signature check, verified for real. It
  # needs cryptography 50.0.2 or later and the runner's python3-cryptography has
  # no ML-DSA, so this suite cannot run in the shell job: the wheel is installed
  # into a virtual environment from scripts/release/render-requirements.txt,
  # pinned by hash and binary only, and that environment comes first on PATH for
  # the suite and for the renderer it runs. Without the wheel the suite fails
  # and says what is missing; it never skips.
  #
  # A job of its own rather than a second package list in the reusable: the
  # reusable installs from the distribution, and this is the one suite that
  # needs a library the distribution does not carry. It holds no secret.
  mldsa:
    name: ML-DSA-65 verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Measured 10 seconds locally for the venv, the three wheels and the suite.
    # Ten minutes is far above that and far below the six-hour default a hang
    # would otherwise cost.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install the pinned cryptography wheel
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mldsa-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/release/render-requirements.txt
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Run the ML-DSA-65 verifier suite
        run: |
          set -euo pipefail
          ./tests/ci/suites/check-suite-completeness.test.sh ./tests/release/release-signature/release-signature-mldsa.test.sh

  products:
    concurrency:
      group: products-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: products match the generator
    runs-on: ubuntu-latest
    # Measured at 5 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: bucket/ must match PRODUCTS
        run: |
          set -euo pipefail
          # The check lives in scripts/ so it can be tested. Inline here it was
          # reachable only by a real CI run, which is why it had never been
          # watched fail. tests/artifacts/check-products-consistent.test.sh covers it.
          ./scripts/artifacts/check-products-consistent.sh

  manifests:
    concurrency:
      group: manifests-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: validate manifests
    runs-on: ubuntu-latest
    # Measured at 4 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check each manifest is valid JSON with the required fields
        run: |
          set -euo pipefail
          # One copy, called from here and from update.yml. It used to be
          # duplicated in both with a comment on each asking whoever edited one
          # to keep the other in step.
          ./scripts/artifacts/check-manifests.sh

      - name: A manifest never goes back to an older release
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The renderer refuses a rollback, a hand edit does not. The base is
          # fetched on its own: the checkout is shallow and has no history.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          ./scripts/artifacts/check-version-monotonic.sh "$BASE_SHA"
