name: Tests

# The shell lint, this repository's own suite, and the two checks that read the
# generated tree: that PRODUCTS/README/bucket still agree, and that every
# manifest is valid JSON with the fields Scoop needs.
#
# Split out of the former ci.yml, which carried the suite, pull request hygiene
# and two freshness watchers in one file. They fail for different reasons and
# are read by different people.
#
# Job ids are unchanged. A required status check is named
# `<caller job id> / <inner job name>` and the FILE is not part of that name, so
# moving a job to another workflow leaves its check name alone. Renaming one is
# a ruleset change, not tidying.
#
# The suite is listed one per line. As a single line it outgrew any terminal,
# which is how a suite went missing from apt's without anyone noticing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    uses: ./.github/workflows/reusable-shell-ci.yml
    with:
      test-command: >-
        ./tests/render-manifests.test.sh
        && ./tests/update-workflow.test.sh
        && ./tests/check-products-consistent.test.sh
        && ./tests/check-manifests.test.sh
        && ./tests/locale-pinned.test.sh
        && ./tests/check-test-coverage.test.sh
        && ./tests/check-dco-on-main.test.sh
        && ./tests/ci-runs-every-test.test.sh
        && ./tests/lint-workflow-shell.test.sh
        && ./tests/reusable-line-limit.test.sh
        && ./tests/reusable-shell-ci.test.sh
        && ./tests/reusable-empty-diff.test.sh
        && ./tests/reusable-dco.test.sh
        && ./tests/check-editorconfig.test.sh
        && ./tests/check-reusable-drift.test.sh
        && ./tests/check-render-drift.test.sh
        && ./tests/reusable-dependabot-freshness.test.sh
        && ./tests/reusable-schedule-freshness.test.sh
        && ./tests/reusable-workflow-lint.test.sh
      # shellcheck: tests/lint-workflow-shell.test.sh plants a violation and
      # requires the linter to report it, so it needs the linter. The gate
      # itself runs in the shellcheck job against the pinned binary; this one
      # asserts behaviour, which does not turn on the exact version.
      # python3-yaml: the tooling-isolation step tests/reusable-workflow-lint.test.sh
      # executes imports it, exactly as the workflow-lint job installs it.
      apt-packages: shellcheck python3-yaml

  products:
    name: products match the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The README table and bucket/ must match PRODUCTS
        run: |
          set -euo pipefail
          # The check lives in scripts/ so it can be tested. Inline here it was
          # reachable only by a real CI run, which is why it had never been
          # watched fail. tests/check-products-consistent.test.sh covers it.
          ./scripts/check-products-consistent.sh

  manifests:
    name: validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check each manifest is valid JSON with the required fields
        run: |
          set -euo pipefail
          # One copy, called from here and from update.yml. It used to be
          # duplicated in both with a comment on each asking whoever edited one
          # to keep the other in step.
          ./scripts/check-manifests.sh
