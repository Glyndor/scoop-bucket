name: Published bytes

# Daily and on-demand verification of the bytes behind every manifest on main.
# A push to main that touches bucket/ runs it too, so a hand edit is checked
# without waiting for the next daily slot. The schedule remains the backstop.
#
# The workflow has no required status check: it answers about published main,
# not about the pull request that may fix it. Freshness watches its cron.
#
# Each manifest digest is also read against the signed SHA256SUMS of the release its
# url names (render-manifests.sh --verify-published), so a digest of an asset nobody
# signed is refused even when the bytes behind the url match it.
#
# Cost: one release download per declared architecture, currently two. The
# script bounds each transfer to 120 seconds and, in flight, to 100 MiB only when
# the server declares a size; a body without one is checked against the 100 MiB
# cap by its size on disk once the transfer ends. Three attempts per asset.
# The job timeout is above the worst case for the current two assets.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bucket/**
      - scripts/artifacts/check-manifests.sh
      - scripts/release/render-manifests.sh
      - scripts/release/release-signature.sh
      - scripts/release/products.sh
      - scripts/release/render-requirements.txt
      - scripts/monitoring/check-published-manifests.sh
      - .github/workflows/published-bytes.yml

permissions:
  contents: read

concurrency:
  group: published-bytes-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify published bytes
    # ubuntu-latest resolved to ubuntu-26.04 in apt's publish runs on
    # 2026-11-20. The image is named because this job's verdict depends on the
    # tools it ships, so a new image arrives as a commit and not overnight.
    runs-on: ubuntu-26.04
    # Two current assets at three 120-second attempts each leave under twelve
    # minutes of transfer budget. Thirty also covers three assets (under
    # nineteen minutes) and four (under twenty-five), with margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Validate every published manifest before downloading its asset
        run: bash ./scripts/artifacts/check-manifests.sh

      - name: Compare every published asset with its manifest digest
        run: bash ./scripts/monitoring/check-published-manifests.sh

      # The comparison above proves the bytes behind each url are the bytes the
      # manifest declares. It does not prove the digest was ever signed: a file
      # added to a release by someone who cannot forge its SHA256SUMS signature
      # has the digest of its own bytes. So each manifest is also read against
      # the signed SHA256SUMS of the release its url names, with the verifier and
      # the key the render uses. The step is the render job's, word for word
      # (tests/ci/policy/workflows/published-bytes-order.test.sh holds the two
      # together), and this job holds no secret.
      - name: Install the signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-cryptography
          # The ML-DSA-65 half of the release signature needs cryptography
          # 50.0.2, which the distribution does not carry. It is installed only
          # once the renderer's ML-DSA-65 key slot holds a key, the first
          # moment a second signature can be checked at all: until then the
          # renderer refuses a SHA256SUMS.mldsa65.sig before the library is
          # needed, and this job installs nothing from PyPI. The wheel is
          # pinned by hash and binary only, so nothing is resolved at install
          # time and no build script runs in the job that holds no secret; the
          # venv lives outside the workspace.
          if grep -qE '^RELEASE_PQ_PUBKEY2?_B64="[A-Za-z0-9+/]+={0,2}"$' scripts/release/render-manifests.sh; then
            python3 -m venv "$RUNNER_TEMP/mldsa-venv"
            "$RUNNER_TEMP/mldsa-venv/bin/python" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/release/render-requirements.txt
          fi

      - name: Read every manifest digest against the signed checksums
        env:
          # Read-only, for `gh attestation verify` of each asset: the token of the run has `contents: read` and nothing else.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mldsa_venv="${RUNNER_TEMP:-}/mldsa-venv"
          if [ -x "$mldsa_venv/bin/python3" ]; then
            PATH="$mldsa_venv/bin:$PATH"
          fi
          bash ./scripts/release/render-manifests.sh --verify-published
