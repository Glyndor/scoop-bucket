name: update

# Keeps bucket/*.json in sync with each product's latest signed release, the same
# pull model as Glyndor/apt: no product pushes here. This reads their public
# releases, verifies the signed SHA256SUMS against the org release key, validates
# the re-rendered manifests, and commits them straight to `main`, GitHub-signed
# via the createCommitOnBranch mutation, so a new Windows build reaches
# `scoop update` within an hour without any product holding a credential here.
#
# Why a direct commit and not a pull request: the organisation forbids GitHub
# Actions from creating or approving PRs (a locked, org-wide setting), so the
# apt-style "open an auto-merging PR" path is unavailable. Unlike Glyndor/apt,
# whose automation never writes git but publishes to R2, a bucket's git content
# *is* the published artifact, so the update must land as a commit. It lands on
# `main` directly, validated in this workflow *before* it lands (there is no PR
# gate standing between the commit and `scoop install`), and signed by GitHub so
# `main`'s require-signed-commits rule accepts it without a signing key here.
#
# Schedule plus dispatch, no push and no pull_request, by design. This
# is not about a pull request at all: it reads each product's latest
# signed release and re-renders the published artifact. Validation
# runs inside the workflow before the commit, because no pull request review
# stands between the commit and `scoop install`.
#
# Two jobs, and the split is the security boundary, not tidiness:
#
#   render    installs the signature verifier, downloads each product's latest
#             signed release, renders bucket/, validates the manifests it
#             rendered, and records the SHA-256 of every file it wrote. It
#             holds no secret.
#   commit    the only job that mints the updater app's token. It installs
#             nothing and runs no product's code: it checks out the tree, asks
#             for the digests the render job recorded, and commits only the
#             files whose bytes match them.
#
# When all of this was one job, the package installed from the distribution's
# archive and the renderer that reads what a product published ran in the same
# workspace as the step that used the app's token. Secrets are injected per
# step, not per job, so the installed package could not read the key; what it
# could do was persist into the step that does, by rewriting a script the
# commit step then runs. Separate jobs share no workspace, and the digests
# travel through the render job's outputs, which no other job can write.
#
# The digests travel in the outputs and not in the artifact on purpose. The
# commit job downloads the artifact and holds the token that can upload one,
# so a manifest carried inside it is a manifest it could replace.

on:
  schedule:
    # Hourly, at :30 to stay clear of the queue that forms on the hour and to
    # keep the historical offset from apt's 06:00 publish.
    #
    # Was daily. The 24-hour worst case between a product publishing and this
    # channel serving it was the cron, not the pull model: a security fix could
    # sit a day behind with the short path already built and unused.
    #
    # The push alternative is not used. update.yml carries a
    # repository_dispatch trigger a product could POST to, but a push
    # model would let a compromised release workflow write into the
    # distribution channels, and a channel-write token would put signing, the
    # registry and both channels behind one compromise. Pulling more often buys
    # most of the latency back and moves no credential.
    - cron: "30 * * * *"
  workflow_dispatch:
  # Optional instant trigger: a product's release workflow may
  # POST /repos/Glyndor/scoop-bucket/dispatches with event_type "release".
  # Nothing is wired to it today; the hourly schedule is the baseline.
  repository_dispatch:
    types: [release]

permissions:
  contents: read

# Never run two updates at once: they would race on main's HEAD (the second
# would fail its expectedHeadOid check and drop the update to the next run).
# The group covers the whole run, both jobs.
concurrency:
  group: update-manifests
  cancel-in-progress: false

jobs:
  render:
    name: Render
    # ubuntu-latest resolved to ubuntu-26.04 in apt's publish runs on
    # 2026-11-20. The image is named because this job's verdict depends on the
    # tools it ships, so a new image arrives as a commit and not overnight.
    runs-on: ubuntu-26.04
    # contents:read is enough: this job writes nothing outside its own
    # workspace, and the write happens in the commit job with the app's token.
    permissions:
      contents: read
    # The concurrency group above serialises the hourly runs, so one run that
    # hangs on a download holds every later one behind it until the six-hour
    # default kills it. Ten minutes is far above an honest run and bounds the
    # worst case to one missed hour instead of six.
    #
    # The figure this used to quote (13 to 20 seconds) was measured before the
    # renderer began verifying each asset's provenance, which downloads every
    # release asset on every run, and no run duration is recorded in this
    # repository. The bound is therefore declared, not derived: a run costs a
    # download of the release assets and a hash of each.
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.render.outputs.changed }}
      partial: ${{ steps.render.outputs.partial }}
      digests: ${{ steps.digests.outputs.digests }}
      head: ${{ steps.digests.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The verifier of the org's release signature comes from the
      # distribution's own archive, so it is an install this repository trusts
      # as much as it trusts its base image. It is here, in the job that holds
      # no secret, and not in the job that does.
      - name: Install the signature verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-cryptography
          # The ML-DSA-65 half of the release signature needs cryptography
          # 50.0.2, which the distribution does not carry. It is installed only
          # once the renderer's ML-DSA-65 key slot holds a key, the first
          # moment a second signature can be checked at all: until then the
          # renderer refuses a SHA256SUMS.mldsa65.sig before the library is
          # needed, and this job installs nothing from PyPI. The wheel is
          # pinned by hash and binary only, so nothing is resolved at install
          # time and no build script runs in the job that holds no secret; the
          # venv lives outside the workspace.
          if grep -qE '^RELEASE_PQ_PUBKEY2?_B64="[A-Za-z0-9+/]+={0,2}"$' scripts/release/render-manifests.sh; then
            python3 -m venv "$RUNNER_TEMP/mldsa-venv"
            "$RUNNER_TEMP/mldsa-venv/bin/python" -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/release/render-requirements.txt
          fi

      - name: Render manifests from the latest signed releases
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The install step built the virtual environment with the ML-DSA-65
          # capable cryptography, and only when the renderer's key slot holds
          # a key. Its python comes first on PATH so the renderer verifies the
          # second signature with it; without a key there is no venv and the
          # render runs on the distribution's python3-cryptography, which has
          # no ML-DSA and needs none.
          mldsa_venv="${RUNNER_TEMP:-}/mldsa-venv"
          if [ -x "$mldsa_venv/bin/python3" ]; then
            PATH="$mldsa_venv/bin:$PATH"
          fi
          # Exit 3 means the generator skipped at least one product and rendered
          # the rest: its release was unreadable, its SHA256SUMS did not verify,
          # or an asset the table names was missing. Carry on and commit what did
          # render, then fail the run in the last step so the skip is loud.
          # Holding a good update back because an unrelated product's release is
          # broken is exactly what this replaced. Any other non-zero is a failure
          # before any product was reached, and stops the run here.
          rc=0
          bash ./scripts/release/render-manifests.sh || rc=$?
          case "$rc" in
            0) echo "partial=0" >> "$GITHUB_OUTPUT" ;;
            3) echo "partial=1" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
          # adds merges the diff of tracked bucket/ files (ACMR) with the
          # untracked ones under bucket/. A product's first manifest is
          # untracked until this commit lands, so the diff alone reports no
          # change for it and the additions payload below would also be empty:
          # the new product would never reach `main`, and the bucket would not
          # learn it exists until somebody committed the manifest by hand.
          #
          # dels is the third kind, and leaving it out meant removing a product
          # never landed either. `--diff-filter=ACMR` names added, copied,
          # modified and renamed paths and not deleted ones, so the renderer
          # dropped the manifest, this gate reported no change, and the commit
          # step never ran. That step was never the problem: it already derives
          # its own `dels` with `--diff-filter=D` and sends them as deletions,
          # so the capability was built and unreachable from one filter chain
          # above it. Adds and dels stay separate because an untracked path can
          # never be a deletion.
          adds="$(
            { git diff --name-only --diff-filter=ACMR -- bucket
              git ls-files -o --exclude-standard -- bucket; } | LC_ALL=C sort -u
          )"
          dels="$(git diff --name-only --diff-filter=D -- bucket)"
          # Refuse a deletion-only render that would empty the bucket. The
          # validation step's own empty-bucket guard would catch it, but only
          # after this step has run, and on the cron that is a red nobody can
          # clear with no pull request to fix. Refusing here is the only place
          # the message can name the cause.
          if [ -n "$dels" ] && [ -z "$adds" ]; then
            # What survives the deletion: the tracked set minus the deleted
            # paths. `grep` exits 1 when nothing matches, and under `set -e` a
            # failed assignment would leave the script before the check below.
            remaining="$(git ls-files -- bucket | grep -Fxvf <(printf '%s\n' "$dels") || true)"
            if [ -z "$remaining" ]; then
              echo "::error::the render would empty the bucket; refusing to commit an empty channel"
              exit 1
            fi
          fi
          if [ -z "$adds" ] && [ -z "$dels" ]; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "No manifest changed."
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the re-rendered manifests
        if: steps.render.outputs.changed == '1'
        run: |
          set -euo pipefail
          # The same gate as tests.yml, run BEFORE the commit lands. A malformed
          # render must never reach `main`: here the commit is the published
          # artifact, with no PR review between it and `scoop install`. Each
          # manifest must be valid JSON with version, homepage, license, and a
          # url+hash+bin per declared architecture.
          # The empty-bucket refusal is inside the script, and it is the
          # first thing it does. It has to be: a loop over no manifests
          # succeeds, so "every manifest is valid" would be true of a bucket
          # that serves nobody -- which is how an emptied bucket reaches
          # `scoop install` with nothing between it and the user.
          #
          # The gate needs no toolchain beyond what the runner image already
          # carries, which is why it runs here and not in the job that holds
          # the key. It runs again in that job, on the bytes that job is about
          # to commit.
          ./scripts/artifacts/check-manifests.sh

      # The manifest goes to the next job twice, and only one copy counts.
      # The copy in the artifact is for a person reading a run. The one the
      # commit job checks travels in this job's outputs: the commit job
      # downloads the artifact and holds the token that can upload one, so
      # anything inside the artifact is something it could replace. A job's
      # outputs are written by that job alone. The head this job rendered from
      # travels the same way, because the commit job's diff is only right
      # against the same parent.
      - name: Record the digest of every rendered manifest
        id: digests
        if: steps.render.outputs.changed == '1'
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/rendered"
          manifest="$RUNNER_TEMP/manifests.sha256"
          bash ./scripts/artifacts/manifest-digests.sh list . > "$manifest"
          rm -rf "$staged"
          mkdir -p "$staged"
          cp -R bucket "$staged/bucket"
          cp "$manifest" "$staged/manifests.sha256"
          bash ./scripts/artifacts/manifest-digests.sh check "$staged" "$manifest"
          echo "digests=$(base64 -w0 < "$manifest")" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Seven days so a red run can still be read; the artifact is only a
      # carrier between the jobs of one run.
      - name: Upload the rendered manifests
        if: steps.render.outputs.changed == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-manifests
          path: ${{ runner.temp }}/rendered
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Commit
    # With the default rule: this job runs only when the render succeeded. It
    # carries no `if:` of its own, because any status function there
    # (`always()`, `!cancelled()`) would let it run after a failed render.
    needs: render
    # The image is named, as everywhere else: a new one arrives as a commit.
    runs-on: ubuntu-26.04
    # contents:read is enough for GITHUB_TOKEN: the write goes through the
    # updater app's token, minted below.
    permissions:
      contents: read
    # A checkout, a download, two checks with no toolchain and two API calls.
    # Ten minutes bounds a stalled API call far below the six-hour default,
    # and the same bound the render job carries is far above an honest run.
    timeout-minutes: 10
    # Nothing in this job installs anything, and that is the rule it exists
    # to keep: it is the only job that holds a secret. What it runs is the
    # runner image (git, gh, jq, python3), this repository's own scripts from
    # a fresh checkout, and three first-party actions pinned by commit.
    steps:
      - if: needs.render.outputs.changed == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the rendered manifests
        if: needs.render.outputs.changed == '1'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendered-manifests
          path: ${{ runner.temp }}/rendered

      # The bytes committed are the bytes the render job recorded, or nothing
      # is committed. The digests come from the render job's outputs and not
      # from the artifact, which this job could have replaced. The manifest
      # gate runs again on the placed files, because it is the last reader of
      # their meaning and it costs nothing here. All of it runs before the key
      # is used, so a run that refuses its bytes never mints.
      - name: Check the rendered bytes against the render job's digests
        if: needs.render.outputs.changed == '1'
        env:
          RENDERED_DIGESTS: ${{ needs.render.outputs.digests }}
          RENDERED_HEAD: ${{ needs.render.outputs.head }}
        run: |
          set -euo pipefail
          # The commit step diffs the placed files against this checkout and
          # pins this checkout's HEAD as the parent. Against any other parent
          # than the one the render read, that diff would undo whatever landed
          # in between.
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$RENDERED_HEAD" ]; then
            echo "::error::this checkout is at ${head:-nothing}, the render read ${RENDERED_HEAD:-nothing}; refusing to commit against another parent"
            exit 1
          fi
          expected="$RUNNER_TEMP/expected.sha256"
          printf '%s' "$RENDERED_DIGESTS" | base64 -d > "$expected"
          bash ./scripts/artifacts/manifest-digests.sh place "$RUNNER_TEMP/rendered" . "$expected"
          bash ./scripts/artifacts/check-manifests.sh

      # main now has required status checks, and a direct push has none, so
      # the commit below needs a bypass actor. github-actions[bot] cannot be
      # one; a GitHub App can. glyndor-updater is that app, installed on this
      # repository with contents:write and nothing else, and its id and key
      # live in the repository's variables and secrets. The token lives for
      # this job only.
      #
      # No `if:` here on purpose. The step used to be gated on
      # `changed == '1'`, which meant a removed installation or an invalid
      # private key stayed invisible until the next run that had something
      # to publish, and the next real release was the first run to fail.
      # Mints run on every schedule instead: one extra API call, and a
      # broken credential turns into a red run the next hour instead of at
      # the next release.
      - name: Mint a token for the updater app
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.UPDATER_APP_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          # The token is asked for with the one permission the commit needs.
          # Without this it carries whatever the installation grants, and
          # those settings live on GitHub where this tree cannot check them:
          # widening the installation for another use would widen this token
          # with no change here.
          permission-contents: write

      - name: Commit the update to main (GitHub-signed)
        if: needs.render.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Commit the re-rendered manifests onto `main` with the GraphQL
          # createCommitOnBranch mutation. That commit is signed by GitHub
          # (Verified), and the require-signed-commits rule on `main` rejects the
          # unsigned commit a plain `git commit`/`git push` would make, and this
          # needs no signing key (unlike `git commit -S`). expectedHeadOid pins
          # the parent to the HEAD we rendered from, so if main moved since
          # checkout the mutation fails cleanly instead of clobbering, and the next
          # scheduled run re-renders from the new HEAD. Tracked additions (ACMR)
          # and untracked files both go in fileChanges.additions (base64),
          # removed ones in deletions. Deletions keep their own
          # `--diff-filter=D` derivation, because an untracked path can never
          # be a deletion; folding the two would be wrong rather than shorter.
          head="$(git rev-parse HEAD)"
          # NUL-separated and unquoted: without -z and core.quotePath=off git
          # prints a non-ASCII path as "bucket/caf\303\251.json" in quotes, which
          # is not a file, and the base64 of it used to be swallowed inside the
          # --arg below and committed as an empty file. The contents are read
          # into a variable first so that a failure stops the step.
          adds="$(
            { git -c core.quotePath=off diff -z --name-only --diff-filter=ACMR -- bucket
              git -c core.quotePath=off ls-files -z -o --exclude-standard -- bucket; } | LC_ALL=C sort -zu \
            | while IFS= read -r -d '' f; do
              contents="$(base64 -w0 "$f")" || { echo "::error::cannot read $f" >&2; exit 1; }
              jq -cn --arg path "$f" --arg contents "$contents" '{path:$path, contents:$contents}'
            done | jq -cs '.'
          )"
          dels="$(git -c core.quotePath=off diff -z --name-only --diff-filter=D -- bucket | while IFS= read -r -d '' f; do
            jq -cn --arg path "$f" '{path:$path}'
          done | jq -cs '.')"
          gh_api_query=$(jq -n \
            --arg repo "$REPO" --arg branch "main" --arg head "$head" \
            --arg msg "chore: update manifests from the latest signed releases" \
            --argjson adds "$adds" --argjson dels "$dels" \
            '{query:"mutation($repo:String!,$branch:String!,$head:GitObjectID!,$msg:String!,$changes:FileChanges!){createCommitOnBranch(input:{branch:{repositoryNameWithOwner:$repo,branchName:$branch},expectedHeadOid:$head,message:{headline:$msg},fileChanges:$changes}){commit{oid}}}",
              variables:{repo:$repo,branch:$branch,head:$head,msg:$msg,changes:{additions:$adds,deletions:$dels}}}' \
          )
          # This runs as the updater app's installation token, minted in the
          # step above, so the ruleset's bypass for that app applies and the
          # commit is authored by glyndor-updater[bot], which dco-on-main.yml
          # exempts by pusher. The GraphQL mutation is what makes the commit
          # GitHub-signed, which
          # is what `main`'s require-signed-commits rule accepts without any
          # signing key being stored in this repository. Do not swap it for a
          # plain `git push`: that commit would be unsigned and the ruleset
          # would refuse it, which stops the channel publishing.
          echo "$gh_api_query" | gh api graphql --input - >/dev/null
          echo "Committed the manifest update to main."

      - name: Fail if any product was skipped
        if: needs.render.outputs.partial == '1'
        run: |
          # Last, on purpose: the products that did render are already committed
          # by now, so a broken release in one product costs that product's
          # update and nothing else. This step is what keeps the skip from being
          # silent: the render step's annotations name which products and why.
          echo "::error::the render skipped at least one product; see the annotations on the render step"
          exit 1
