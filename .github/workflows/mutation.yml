name: Mutation

# The catalogue of mutations: every entry breaks one guard of the scripts of this
# repository on purpose and names the tests that must notice. A guard that no
# test notices is decoration, and reading the suite cannot tell which ones are
# decoration: the only way to know is to break them and watch it go red.
#
# The catalogue and its runner live in tests/mutation/. The entries were
# derived from the guards the recent test commits closed, and each one was
# checked by hand: with the mutation applied at least one named test fails,
# and with the tree unmutated every one of them passes.
#
# Weekly and on demand, never on a pull request: the sweep is a report and not a
# gate. The pull request path already runs the suites, and what the sweep adds
# is the question the suites cannot answer on their own -- whether they would
# still notice a guard that was quietly weakened.
#
# It is deliberately not a required status check. A survivor is a hole in the
# suite, not a defect in the pull request in front of it, and a required check
# would let one repository's weekly report block an unrelated change.
on:
  schedule:
    - cron: "17 4 * * 1" # Monday, 04:17 UTC: a minute nobody else takes
    # The cron of one run on 24 November did not fire: GitHub starts a scheduled run late and drops some under load, and
    # the Monday one of 23 November was cut at its bound. The freshness watcher wants a scheduled run that succeeded and a
    # manual one is not that, so this tries at three hours, three hours apart: 02:53, 05:53 and 08:53 UTC on 25 November.
    # Each job asks first, in a step, whether a scheduled run has already succeeded, and leaves the sweep undone, with success,
    # when it has, so once one has the others cost a minute. The weekly run never asks. The tries are removed once one has
    # succeeded; left in, they would fire every year.
    - cron: "53 2,5,8 25 11 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The group is per run outside a pull request. A group shared by the schedule and a
  # manual run lets GitHub drop the run that is still waiting when a newer one queues, even
  # with `cancel-in-progress: false`, and a scheduled run that never ends is one the
  # freshness watcher can never count. tests/ci/policy/rules/cancel-policy.test.sh holds
  # this for every workflow that has a schedule.
  group: mutation-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  # A scheduled run is never replaced by the next one (see cancel-policy.test.sh).
  cancel-in-progress: false

jobs:
  mutations:
    name: the guards still die under their mutations ({{ matrix.fragment }})
    # ubuntu-latest resolved to ubuntu-26.04 in apt's publish runs on
    # 2026-11-20. The image is named because this job's verdict depends on the
    # tools it ships, so a new image arrives as a commit and not overnight.
    runs-on: ubuntu-26.04
    # One job for each file of the catalogue, so the sweep takes as long as its largest file and
    # not as long as all of them. The whole sweep in one job was cut at its twenty minutes on
    # 2026-11-23, and GitHub reports a job that exceeds its bound as `cancelled`: not a success,
    # so the freshness watcher cannot count it, and the grace period of a new cron ends with its
    # first run. The bound of each fragment is its measured time, in tests/mutation/
    # sweep-durations.txt, scaled to the entries it has and with a half on top; the policy suite
    # named below fails the pull request that makes a fragment outgrow it, and the one that adds a
    # file of the catalogue that is not listed here. A fragment that fails does not stop the rest.
    # tests/ci/policy/workflows/mutation-sweep-is-split-and-bounded.test.sh holds all of it.
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - fragment: tests/mutation/catalog.txt
            minutes: 50
          - fragment: tests/mutation/catalog.d/monitoring.txt
            minutes: 12
          - fragment: tests/mutation/catalog.d/ruleset.txt
            minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Whether a scheduled run has succeeded already, for the runs that exist only to try again. The step never fails: every
      # doubt answers that the sweep must run, and the weekly run is never skipped (scripts/monitoring/scheduled-run-exists.sh).
      - name: Ask whether the sweep still has something to answer
        id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: mutation.yml
          DAYS: "3"
          THIS_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          WEEKLY_CRON: "17 4 * * 1"
        run: bash ./scripts/monitoring/scheduled-run-exists.sh >> "$GITHUB_OUTPUT"

      - name: Break every guard of the fragment on purpose and watch the suites notice
        env:
          FRAGMENT: ${{ matrix.fragment }}
          SKIP: ${{ steps.ask.outputs.skip }}
        run: |
          set -euo pipefail
          if [ "$SKIP" = true ]; then
            echo "a scheduled run has succeeded already; this one has nothing left to answer"
            exit 0
          fi
          bash ./tests/mutation/run-mutations.sh --catalog "$FRAGMENT"
