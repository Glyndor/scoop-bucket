name: CI

# Validates every manifest on each PR and push to main, so a malformed or
# incomplete manifest fails review instead of a `scoop install`. A structural
# jq check (no network, no third-party action) covers the fields Scoop requires.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fail a pull request whose diff against main is empty. Eight no-op PRs
  # landed on the sibling tap (Glyndor/homebrew-tap) before this gate existed:
  # the work was already in main via squash-merge, the branch was recreated
  # as -v2, and the second merge landed as a commit with zero files changed.
  # The same shape lives here, so the same gate applies. Pinned to the SHA
  # that is the v1.14.0 tag so this is one of the consumers that proves the
  # reusable; once the emitted name has stayed stable across a few weeks of
  # green, I will promote this from advisory to required in the ruleset.
  empty-diff:
    if: github.event_name == 'pull_request'
    uses: Glyndor/.github/.github/workflows/empty-diff.yml@c958978687af37dc2d826a967d9c549589afb39f # v1.14.1

  # Lint scripts/ the same way Glyndor/apt does. The generator verifies a
  # release signature and writes the file users install from, and the update
  # workflow commits its output straight to main, so a bug in render-manifests.sh
  # reaches users with no pull request in between. `bash -n` plus a pinned
  # shellcheck, both from the reusable.
  shell:
    uses: Glyndor/.github/.github/workflows/shell-ci.yml@3a46ffe91ecadcce7f14c99ea8b23ead4274f325 # v1.13.2
    with:
      test-command: ./tests/render-manifests.test.sh && ./tests/update-workflow.test.sh

  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@925d55b1f816a8a0c0bcfb3838a88ced31d0bff4 # v1.14.2

  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@925d55b1f816a8a0c0bcfb3838a88ced31d0bff4 # v1.14.2
    with:
      max-age-days: 15

  products:
    name: products match the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The README table and bucket/ must match PRODUCTS
        run: |
          set -euo pipefail
          # scripts/render-manifests.sh's PRODUCTS table is the only place a
          # product is declared. Two things restate it and cannot be generated
          # from it: the README's "Available manifests" table, and the set of
          # files under bucket/. With one product the drift is invisible; with
          # the full roster it is certain, and it is the same rot as the install
          # snippet corrected in #8.
          declared="$(awk '/^PRODUCTS=\(/ { inside = 1; next }
                           inside && /^\)/  { exit }
                           inside           { print }' scripts/render-manifests.sh \
                     | sed -n 's/^[^"]*"[^|]*|\([^|]*\)|.*/\1/p' | sort -u)"
          [ -n "$declared" ] || { echo "::error::could not read PRODUCTS out of scripts/render-manifests.sh"; exit 1; }

          # Backticks and "$" never appear inside the single quotes below. They
          # would be awk's and Markdown's, but SC2016 reads them as shell
          # expansions and actionlint runs shellcheck over this block; a
          # file-level disable directive is not honoured there.
          documented="$(awk '/^\| Manifest \| Product \|/ { inside = 1; next }
                             inside && /^\|---/ { next }
                             inside && /^\|/    { print; next }
                             inside              { exit }' README.md \
                       | cut -d'|' -f2 | tr -cd '[:alnum:]._\n-' | awk 'NF' | sort -u)"

          rendered="$(find bucket -maxdepth 1 -name '*.json' -printf '%f\n' \
                     | while read -r f; do echo "${f%.json}"; done | sort -u)"

          status=0
          if [ "$declared" != "$documented" ]; then
            echo "::error file=README.md::the README's Available manifests table disagrees with PRODUCTS"
            diff <(echo "$declared") <(echo "$documented") | sed 's/^/  /' || true
            status=1
          fi
          if [ "$declared" != "$rendered" ]; then
            echo "::error::bucket/ disagrees with PRODUCTS — re-run scripts/render-manifests.sh"
            diff <(echo "$declared") <(echo "$rendered") | sed 's/^/  /' || true
            status=1
          fi
          [ "$status" -eq 0 ] && echo "ok  $(echo "$declared" | tr '\n' ' ')"
          exit "$status"

  manifests:
    name: validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check each manifest is valid JSON with the required fields
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(bucket/*.json)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "::error::no manifests found under bucket/"
            exit 1
          fi
          for m in "${manifests[@]}"; do
            # Fails if $m is not valid JSON, or if any required field is missing:
            # version, homepage and license (Scoop's three required root fields),
            # and a url+hash+bin for each declared architecture. Keep this in step
            # with update.yml's own copy, which gates the commit before it lands.
            jq -e '
              (.version | type == "string" and (. | length > 0))
              and (.homepage | type == "string")
              and (.license | type == "string")
              and (.architecture | type == "object" and (. | length > 0))
              and (.architecture | to_entries | all(
                    .value.url and .value.hash and (.value.bin | type == "array")))
            ' "$m" >/dev/null || {
              echo "::error file=$m::$m is not a valid, complete Scoop manifest"
              exit 1
            }
            echo "ok  $m"
          done
