name: CI

# Validates every manifest on each PR and push to main, so a malformed or
# incomplete manifest fails review instead of a `scoop install`. A structural
# jq check (no network, no third-party action) covers the fields Scoop requires.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  products:
    name: products match the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The README table and bucket/ must match PRODUCTS
        run: |
          # shellcheck disable=SC2016 # the awk and sed programs below are single-quoted on purpose: the $ anchors and backticks in them belong to awk, sed and Markdown, not to the shell
          set -euo pipefail
          # scripts/render-manifests.sh's PRODUCTS table is the only place a
          # product is declared. Two things restate it and cannot be generated
          # from it: the README's "Available manifests" table, and the set of
          # files under bucket/. With one product the drift is invisible; with
          # the full roster it is certain, and it is the same rot as the install
          # snippet corrected in #8.
          declared="$(awk '/^PRODUCTS=\(/ { inside = 1; next }
                           inside && /^\)/  { exit }
                           inside           { print }' scripts/render-manifests.sh \
                     | sed -n 's/^[^"]*"[^|]*|\([^|]*\)|.*/\1/p' | sort -u)"
          [ -n "$declared" ] || { echo "::error::could not read PRODUCTS out of scripts/render-manifests.sh"; exit 1; }

          documented="$(awk '/^\| Manifest \| Product \|/ { inside = 1; next }
                             inside && /^\|---/           { next }
                             inside && /^\|/              { print; next }
                             inside                       { exit }' README.md \
                       | sed -n 's/^| `\([^`]*\)`.*/\1/p' | sort -u)"

          rendered="$(find bucket -maxdepth 1 -name '*.json' -printf '%f\n' \
                     | while read -r f; do echo "${f%.json}"; done | sort -u)"

          status=0
          if [ "$declared" != "$documented" ]; then
            echo "::error file=README.md::the README's Available manifests table disagrees with PRODUCTS"
            diff <(echo "$declared") <(echo "$documented") | sed 's/^/  /' || true
            status=1
          fi
          if [ "$declared" != "$rendered" ]; then
            echo "::error::bucket/ disagrees with PRODUCTS — re-run scripts/render-manifests.sh"
            diff <(echo "$declared") <(echo "$rendered") | sed 's/^/  /' || true
            status=1
          fi
          [ "$status" -eq 0 ] && echo "ok  $(echo "$declared" | tr '\n' ' ')"
          exit "$status"

  manifests:
    name: validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check each manifest is valid JSON with the required fields
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(bucket/*.json)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "::error::no manifests found under bucket/"
            exit 1
          fi
          for m in "${manifests[@]}"; do
            # Fails if $m is not valid JSON, or if any required field is missing:
            # version, homepage and license (Scoop's three required root fields),
            # and a url+hash+bin for each declared architecture. Keep this in step
            # with update.yml's own copy, which gates the commit before it lands.
            jq -e '
              (.version | type == "string" and (. | length > 0))
              and (.homepage | type == "string")
              and (.license | type == "string")
              and (.architecture | type == "object" and (. | length > 0))
              and (.architecture | to_entries | all(
                    .value.url and .value.hash and (.value.bin | type == "array")))
            ' "$m" >/dev/null || {
              echo "::error file=$m::$m is not a valid, complete Scoop manifest"
              exit 1
            }
            echo "ok  $m"
          done
