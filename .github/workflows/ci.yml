name: CI

# Validates every manifest on each PR and push to main, so a malformed or
# incomplete manifest fails review instead of a `scoop install`. A structural
# jq check (no network, no third-party action) covers the fields Scoop requires.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fail a pull request whose diff against main is empty. Eight no-op PRs
  # landed on the sibling tap (Glyndor/homebrew-tap) before this gate existed:
  # the work was already in main via squash-merge, the branch was recreated
  # as -v2, and the second merge landed as a commit with zero files changed.
  # The same shape lives here, so the same gate applies. Pinned to the SHA
  # that is the v1.14.0 tag so this is one of the consumers that proves the
  # reusable; once the emitted name has stayed stable across a few weeks of
  # green, I will promote this from advisory to required in the ruleset.
  empty-diff:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-empty-diff.yml

  # Lint scripts/ the same way Glyndor/apt does. The generator verifies a
  # release signature and writes the file users install from, and the update
  # workflow commits its output straight to main, so a bug in render-manifests.sh
  # reaches users with no pull request in between. `bash -n` plus a pinned
  # shellcheck, both from the reusable.
  shell:
    uses: ./.github/workflows/reusable-shell-ci.yml
    with:
      test-command: ./tests/render-manifests.test.sh && ./tests/update-workflow.test.sh && ./tests/check-products-consistent.test.sh && ./tests/check-manifests.test.sh && ./tests/check-test-coverage.test.sh && ./tests/locale-pinned.test.sh

  dependabot-freshness:
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15

  products:
    name: products match the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The README table and bucket/ must match PRODUCTS
        run: |
          set -euo pipefail
          # The check lives in scripts/ so it can be tested. Inline here it was
          # reachable only by a real CI run, which is why it had never been
          # watched fail. tests/check-products-consistent.test.sh covers it.
          ./scripts/check-products-consistent.sh

  manifests:
    name: validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check each manifest is valid JSON with the required fields
        run: |
          set -euo pipefail
          # One copy, called from here and from update.yml. It used to be
          # duplicated in both with a comment on each asking whoever edited one
          # to keep the other in step.
          ./scripts/check-manifests.sh

  # A cron that stops firing emits nothing, and "no alert" is indistinguishable
  # from "all clear". Every scheduled workflow in this org went dark on
  # 2026-06-29 and four repos stayed dark for another four weeks, all reporting
  # `active` throughout. This turns the absence of a scheduled run into a red
  # check on ordinary work.

  freshness-update:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: update.yml
      max-age-days: 3
