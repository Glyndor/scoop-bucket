name: DCO on main

# Detection, not prevention, and the difference is the whole point of this file.
#
# Keep this post-push check as detection in addition to the pull request DCO
# gate. update.yml writes through the glyndor-updater GitHub App; its bypass
# identity allows required checks to gate human changes without blocking the
# automated publication path. This workflow reports commits already on the
# install branch and cannot prevent them from landing.
#
# Commits pushed by github-actions[bot] or by glyndor-updater[bot], the app
# update.yml commits through, are exempt, and that is not a loophole.
# DCO is a person's attestation about their right to submit code. A bot
# regenerating a manifest from an already-verified release is not contributing in
# that sense, and emitting a trailer on its behalf would manufacture an
# attestation nobody made -- which is worse than its absence, and was rejected
# when it was proposed. Exempting the bot scopes the rule to who it applies to;
# it does not fake compliance.
#
# Push to main only, by design. A pull request trigger would ask the
# question before the commit lands on `main`, where `scoop install` reads
# from. By the time this fires the commit is already on the install
# branch, so this file can only report, never gate.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco-on-main:
    name: every human commit on main is signed off
    runs-on: ubuntu-latest
    # Measured at 8 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          # From GitHub's event payload, not from any git config.
          PUSHER: ${{ github.event.pusher.name }}
        run: |
          set -euo pipefail
          ./scripts/governance/check-dco-on-main.sh "$BEFORE" "$AFTER" "$PUSHER"
