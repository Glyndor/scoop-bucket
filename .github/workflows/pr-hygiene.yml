name: PR hygiene

# Checks that only make sense against a pull request, kept apart from the suite
# so a red here reads as "the pull request is malformed" rather than "the code
# is broken".
#
# empty-diff catches a pull request whose diff against the base is empty. Eight
# no-op pull requests landed on this repository and the sibling tap before this
# gate existed: the work was already on main via squash-merge, the branch was
# recreated as -v2, and the second merge landed with zero files changed. CI was
# happy with that, because a commit with no diff is valid git.

# Pull request only. empty-diff asks whether a pull request's DIFF against
# its base ref is empty, which is not the same as asking whether it carries
# commits: a re-created branch whose work already merged carries commits and
# changes nothing. A push to `main` has no base ref to compare against, so
# the trigger says that rather than an `if:` repairing it afterwards.

on:
  pull_request:

permissions:
  contents: read

jobs:
  empty-diff:
    uses: ./.github/workflows/reusable-empty-diff.yml
