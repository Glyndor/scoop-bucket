name: Freshness

# Watchers for things whose failure mode is silence.
#
# A cron that stops firing emits nothing, and "no alert" is indistinguishable
# from "all clear". Every scheduled workflow in this org went dark on
# 2026-06-29 and four repositories stayed dark for another four weeks, all
# reporting `active` throughout. These turn the ABSENCE of a scheduled run into
# a red check on ordinary work, which is the only place anyone would see it.
#
# dependabot-freshness watches the same shape from the other side: a
# dependabot.yml in the repository is not proof Dependabot is running.
#
# Separate from the suite on purpose. These fail because something did not
# happen elsewhere, never because this pull request is wrong.

# A schedule and a push to main, and a pull request only when it changes this
# workflow or the reusables it calls. Not every pull request, and the reason is
# measured rather than assumed: every job in this file answers a question about main or
# about a cron somewhere else, never about the change in the pull request, so
# the same five verdicts were produced once per pull request without learning
# anything the previous pull request had not already said.
#
# Measured 2026-11-06 over the last fourteen pull request runs of this
# workflow: five jobs every time, 19 to 28 seconds of job time (mean 23), and
# a wall clock from 12 seconds to 112 minutes that was queue rather than work.
# The run was created when the pull request opened and finished long after its
# answer had stopped mattering.
#
# What is left still watches the same thing, and the push is not the
# decoration: a cron that stops firing is exactly what freshness-itself cannot
# report about itself, so the path that fires without the cron is the one that
# has to stay. Measured the same day, the schedule fired twice and main moved
# five times before midday, update.yml committing to it directly.
#
# Never promote one of these to a required check. What they measure lives
# outside the pull request, so an author who did nothing wrong could not
# clear it, and the whole repository would wait on an unrelated repair.
# Measured 2026-11-06 against the live ruleset: the eight required checks are
# shell / test, shell / shellcheck, line-limit / line limit, dco /
# Signed-off-by present on every commit, workflow-lint / workflow-lint,
# empty-diff / empty diff, validate manifests, and products match the
# generator. None of them is a job in this file, so narrowing the trigger
# leaves no required check unreported.
#
# What this gives up: the red tick on work outside those files when the
# schedule and the pushes are silent at once. That takes two crons dying together, and one of
# the two watchers is what catches the first one.

on:
  # A watcher with no schedule only watches while somebody is already looking.
  # Until the schedule was added, these checks fired on pull_request and push
  # and nothing else, so a cron that stopped firing between two pull requests
  # would have gone unreported until a person next visited the repository.
  # The pull request trigger is narrowed to the files below, and the header
  # says why; this schedule and the push to main are what remain for the rest. The freshness thresholds
  # below are measured in days; a watcher that runs only when a person happens
  # to push cannot honour a one-day one.
  #
  # Twice a day rather than daily, because the tightest threshold declared
  # below is two days and a daily run leaves little margin: a single skipped firing
  # (GitHub drops scheduled runs under load, and delays them by up to an hour
  # routinely) would put the check past its own limit before it ever ran.
  #
  # 08:13 and 20:13 rather than on the hour: GitHub queues everyone's :00 and
  # :30 crons together, and the other schedules in this repository already sit
  # there. The morning run is deliberately after the daily publish and update
  # windows, so a successful run of the workflow it watches is already on
  # record by the time it looks.
  schedule:
    - cron: "13 8,20 * * *"
  # A pull request runs these only when it changes what these jobs are made of:
  # this file, the two reusables it calls and the script its suite job runs.
  # Anything else cannot change the
  # verdict, so it would only repeat the five jobs. None of the five is a
  # required check, which is what makes a path filter safe here: a required
  # check behind a filter would never be reported and the pull request would
  # wait for ever.
  pull_request:
    paths:
      - .github/workflows/freshness.yml
      - .github/workflows/reusable-dependabot-freshness.yml
      - .github/workflows/reusable-schedule-freshness.yml
      - scripts/monitoring/check-suite-on-main.sh
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependabot-freshness:
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15

  freshness-update:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: update.yml
      max-age-days: 3

  # The watcher watches itself, and this is the last link rather than a joke.
  #
  # These checks exist to catch a scheduled workflow that stopped firing. Until
  # 2026-08-29 this file had no schedule of its own, so it ran only when somebody
  # pushed; that is fixed. What the fix leaves is one level up: it now has a
  # cron, and nothing watches whether that cron keeps firing. Its silence would
  # read exactly like the silence it exists to break.
  #
  # Deliberately not added in the same change as the schedule.
  # reusable-schedule-freshness fails when no successful scheduled run exists
  # for the workflow it names, and on the day the cron landed there was none, so
  # this would have opened red for a reason that is not a fault. There are now
  # two on record, measured before adding it.
  #
  # Two days rather than one, because the cron runs twice daily and GitHub is
  # late: measured on the first two firings, the 20:13Z slot ran at 22:39Z and
  # the 08:13Z slot at 13:48Z, so delays of two to five and a half hours are
  # ordinary. A one-day threshold on a twice-daily job would sit close enough to
  # its own limit to trip on lateness rather than on failure.
  #
  # count-any-conclusion, because this job watches the workflow it is part
  # of. With the success-only query, one stretch without a successful
  # scheduled run (a paused cron, or another job here staying red) made this
  # job fail every run after that, and a failed run never becomes the success
  # the next query looks for: the alarm re-armed itself with the cron alive,
  # and toggling the workflow could not clear it. What this job can honestly
  # measure about itself is whether the cron fires; the jobs above report the
  # faults.
  freshness-itself:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: freshness.yml
      max-age-days: 2
      count-any-conclusion: true

  # The drift comparison runs from a cron and from nowhere else. Its own file
  # says why: on pull_request the three channels block each other, and on push
  # to main the sibling copies are read from a CDN that is still serving the
  # pre-merge file. So a cron that stops firing takes the comparison with it,
  # silently, which is exactly the shape of failure the jobs above catch for
  # other workflows.
  #
  # Three days, from measurement rather than from the period: the cron asks for
  # 09:41Z and the last five runs started between 13:00Z and 13:50Z. Lateness
  # of a few hours is routine, so a one-day limit on a daily job would report
  # GitHub's queue rather than a fault.
  freshness-drift:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: drift.yml
      max-age-days: 3

  # Report when `main` is red, not just when the workflow stopped firing.
  #
  # reusable-schedule-freshness reads the newest SUCCESSFUL scheduled
  # run of the workflow it names, so a failing run is invisible to it
  # by construction. This job covers the other half: the suite workflow
  # is firing, the run is on record, and the newest COMPLETED one
  # concluded with something other than success.
  #
  # On 2026-09-19 this job read the wrong run on push. It fired at the
  # same moment as the `tests.yml` run for the commit being pushed,
  # asked for the newest COMPLETED `tests.yml` run on `main` (which on
  # a push is the previous commit's run), and a push that fixed a red
  # main got a red cross from this gate while its own `tests.yml` was
  # green. The script now asks for the run whose head_sha is the
  # pushed commit and waits up to 8 minutes for it to finish, so the
  # developer pushing the fix sees the green within minutes rather
  # than on a later visit; the schedule keeps the verdict within hours
  # if nobody pushes.
  #
  # DELIBERATELY NOT a required status check. A red `main` would then
  # block the pull request that repairs it, which is the failure this
  # exists to surface rather than deepen. Watching the ordinary CI path
  # on push to main and on the schedule above is enough.
  #
  # Reads the API with the job's own GITHUB_TOKEN, the same shape
  # reusable-schedule-freshness uses. `actions: read` is the scope that
  # makes that call work, and `contents: read` is what the caller is
  # already granted. GITHUB_EVENT_NAME and GITHUB_SHA are the runner's
  # automatic env vars and reach the script without being listed here.
  suite-on-main:
    name: suite is green on main
    runs-on: ubuntu-latest
    # Bound at 8 minutes by the script's retry budget (32 attempts of
    # 15 seconds); measured suite runs are well under that (apt about
    # 2 minutes, homebrew-tap 1 to 4, scoop-bucket 33 seconds). Ten
    # minutes is the slack.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tests.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: tests.yml
        run: |
          set -euo pipefail
          ./scripts/monitoring/check-suite-on-main.sh
