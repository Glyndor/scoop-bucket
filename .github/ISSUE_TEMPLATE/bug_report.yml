name: Bug report
description: Report a bug or unexpected behavior
title: "[bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please search existing issues to avoid duplicates.
        **Security issue? Do NOT file it here.** Use the Security tab → "Report a vulnerability" instead.
  - type: input
    id: component
    attributes:
      label: Component
      description: Which part of this repository is affected (e.g. a manifest, the renderer, the update workflow).
      placeholder: bucket/podup.json
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Windows version, plus your Scoop version (`scoop --version`).
      placeholder: e.g. Windows 11 23H2, Windows 10 22H2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Project version and how you installed it.
      placeholder: e.g. 5.16.0 (scoop install podup)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant log output. **Redact secrets, IPs, hostnames and emails.**
      render: shell
