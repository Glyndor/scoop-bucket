version: 2

updates:
  # Keep the SHA-pinned actions in the workflows current. This repo has no
  # language package manifest (JSON manifests rendered with jq, plus POSIX
  # shell), so GitHub Actions is the only ecosystem to track.
  #
  # A valid file is not proof this runs. Version updates are registered from
  # the config on the default branch, and that registration can be lost: this
  # repository went silent after 24 July 2026 with the file below unchanged and
  # perfectly valid, and never proposed the .github v1.10.1 bump. Insights ->
  # Dependabot is the only place that shows it; the settings page cannot tell
  # the two states apart. Re-registering needs a commit that CHANGES this file
  # on the default branch, so if it happens again, editing these comments is a
  # legitimate fix.
  # Re-registration touch 2026-08-09: applying the procedure above after
  # Dependabot stopped again between the v1.10.1 → v1.12.0 and v1.12.0 →
  # v1.13.0 bumps. No change to the rules below; the next silence needs the
  # same touch.
  # nosemgrep: dependabot-missing-cooldown -- deliberately no cooldown. The rule
  # assumes an open package ecosystem and a moving tag; here every action is
  # SHA-pinned and GitHub- or Glyndor-owned, no automation auto-merges anything
  # (measured across the org: no workflow arms auto-merge or even references
  # Dependabot), and the owner reviews every bump before it lands. Holding a
  # security bump back for a week costs more than it buys. Removed on purpose in
  # Glyndor/apt#67 -- do not "fix" this by adding a cooldown block.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["type:deps", "type:ci"]
    open-pull-requests-limit: 10
    # Five action references across five workflows, all pinned by SHA. Without
    # grouping, one upstream release day means five near-identical pull
    # requests and five full CI runs.
    # Grouped into two, not one. The Glyndor reusables and the third-party
    # actions get opposite answers from the same review, and a single group
    # forces one answer for both.
    #
    # A .github release usually changes nothing this repository calls. The
    # reusables come back byte-identical and I close the bump as a no-op --
    # #54, #55, #61, #62 and #63 in the month to 23 August 2026. A third-party bump is the
    # opposite: actions/checkout moving is the one thing here worth reading
    # line by line.
    #
    # Under patterns: ["*"] both arrive in the same pull request, so closing
    # the no-op closes the bump that mattered. That is the whole reason for
    # the split: one pull request, one answer.
    groups:
      glyndor-reusables:
        patterns: ["Glyndor/.github*"]
      third-party:
        patterns: ["*"]
        exclude-patterns: ["Glyndor/.github*"]
    # Dependabot infers a prefix from the commit history when this is absent,
    # and here it inferred "build(deps): Bump ..." -- a capitalised verb and a
    # type the label taxonomy does not use. Set it so the generated title is
    # predictable and matches the apt repo's.
    commit-message:
      prefix: chore