version: 2

updates:
  # Keep the SHA-pinned actions in the workflows current. This repo has no
  # language package manifest (JSON manifests rendered with jq, plus POSIX
  # shell), so GitHub Actions is the only ecosystem to track.
  #
  # A valid file is not proof this runs. Version updates are registered from
  # the config on the default branch, and that registration can be lost: this
  # repository went silent after 24 July 2026 with the file below unchanged and
  # perfectly valid, and never proposed the .github v1.10.1 bump. Insights ->
  # Dependabot is the only place that shows it; the settings page cannot tell
  # the two states apart. Re-registering needs a commit that CHANGES this file
  # on the default branch, so if it happens again, editing these comments is a
  # legitimate fix.
  # Re-registration touch 2026-08-09: applying the procedure above after
  # Dependabot stopped again between the v1.10.1 → v1.12.0 and v1.12.0 →
  # v1.13.0 bumps. No change to the rules below; the next silence needs the
  # same touch.
  # nosemgrep: dependabot-missing-cooldown -- deliberately no cooldown. The rule
  # assumes an open package ecosystem and a moving tag; here every action is
  # SHA-pinned and GitHub- or Glyndor-owned, no automation auto-merges anything
  # (measured across the org: no workflow arms auto-merge or even references
  # Dependabot), and the owner reviews every bump before it lands. Holding a
  # security bump back for a week costs more than it buys. Removed on purpose in
  # Glyndor/apt#67 -- do not "fix" this by adding a cooldown block.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["type:deps", "type:ci"]
    open-pull-requests-limit: 10
    # Every action reference in this repository is pinned by SHA. Without
    # grouping, one upstream release day means a near-identical pull request
    # and a full CI run per reference. The count is deliberately not written
    # here: it read "five action references across five workflows" until this
    # repository absorbed its reusables on 26 August 2026, and a number in a
    # comment goes stale with nothing to notice.
    # `grep -rc 'uses: actions/' .github/workflows/` answers it.
    #
    # This used to be split in two groups. The Glyndor reusables and the
    # actions/* got opposite answers from the same review: a .github release
    # usually changed nothing this repository called, and those bumps came
    # back byte-identical and were closed as no-ops (#54, #55, #61, #62 and
    # #63 in the month to 23 August 2026), while actions/checkout moving is
    # the one thing here worth reading line by line. Under a single group both
    # arrived in one pull request, so closing the no-op closed the bump that
    # mattered.
    #
    # That split has nothing left to separate. Every reusable this repository
    # calls now lives here, so no `Glyndor/.github` reference survives for the
    # pattern to match. The group matched nothing and its companion exclusion
    # excluded nothing, which is a config claiming coverage it does not have.
    #
    # The group is named for what it matches, and that rule has now caught the
    # same mistake twice. It was `third-party` while it held actions/checkout,
    # which implies an external maintainer to audit when the group holds
    # GitHub's own runner primitives. It was then `github-owned` alongside
    # `patterns: ["*"]`, true only by accident: every non-local `uses:` here
    # happens to be an actions/* today, and the first one that is not would
    # have landed in a group whose name said otherwise. `actions` is the
    # ecosystem, which is exactly what the pattern selects. A group name is
    # what a reviewer reads before deciding how closely to look at the diff.
    groups:
      actions:
        patterns: ["*"]
    # Dependabot infers a prefix from the commit history when this is absent,
    # and the inference has been unstable across repositories (build(deps):
    # Bump ... in some, chore(deps): bump ... in others). Set it so the
    # generated title is predictable and matches homebrew-tap and podup.
    commit-message:
      prefix: chore
